  <link rel="icon" href="favicon.ico" sizes="32x32">

  <meta property="og:type" content="website">

  <meta property="og:description" content="Bekijk het werk van JPJ Fotografie per categorie: portret, bruiloften, familie, newborn, dieren en bedrijfsfotografie." id="ogDescription">
  <meta property="og:image" content="https://www.jpjfotografie.nl/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="JPJ Fotografie — Vakfotograaf in Zuid-Limburg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Categorie — JPJ Fotografie" id="twitterTitle">
  <meta name="twitter:description" content="Bekijk het werk van JPJ Fotografie per categorie: portret, bruiloften, familie, newborn, dieren en bedrijfsfotografie." id="twitterDescription">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "JPJ Fotografie",
    "description": "Professionele fotograaf in Zuid-Limburg",
    "areaServed": [
      { "@type": "City", "name": "Maastricht" },
      { "@type": "City", "name": "Heerlen" },
      { "@type": "AdministrativeArea", "name": "Zuid-Limburg" },
      { "@type": "AdministrativeArea", "name": "Limburg" }
    ],
    "url": "https://www.jpjfotografie.nl",
    "image": "https://www.jpjfotografie.nl/og-image.jpg",
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]
    }
  }
  </script>
  <script>document.documentElement.className += ' js-anim';</script>
</head>
<body>
  <div id="cursor"><span class="cursor__label">Bekijk</span></div>
  <div class="page-transition" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a href="index.html" class="nav__logo">JPJ Fotografie</a>
    <nav class="nav__links" aria-label="Hoofdmenu">
      <a href="portfolio.html" class="nav__link is-active">Portfolio</a>
      <a href="over-mij.html" class="nav__link">Over mij</a>
      <a href="contact.html" class="nav__link">Contact</a>
    </nav>
    <button class="nav__toggle" id="navToggle" aria-label="Menu openen">Menu</button>
  </header>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <button class="mobile-menu__close" id="menuClose" aria-label="Menu sluiten">×</button>
    <a href="portfolio.html" class="mobile-menu__link is-active">Portfolio</a>
    <a href="over-mij.html" class="mobile-menu__link">Over mij</a>
    <a href="contact.html" class="mobile-menu__link">Contact</a>
  </div>

  <main>
    <section class="page-head container">
      <h1 class="page-head__title" id="catTitle">&nbsp;</h1>
      <div class="page-head__rule"></div>
      <p class="page-head__sub" id="catSub">Werk van JPJ Fotografie.</p>
    </section>

    <div class="subnav" id="subnav">
      <div class="subnav__scroll" id="subnavScroll"></div>
    </div>

    <section class="section container">
      <div class="gallery" id="gallery"></div>
    </section>

    <!-- CTA -->
    <section class="section cta">
      <div class="container">
        <h2 class="cta__title">Interesse in deze stijl?</h2>
        <p class="cta__sub">Neem gerust contact op</p>
        <a href="contact.html" class="cta__link">Stuur een bericht →</a>
      </div>
    </section>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" id="lbClose" aria-label="Sluiten">×</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Vorige">‹</button>
    <picture>
      <source type="image/webp">
      <img class="lightbox__img" id="lbImg" src="" alt="" sizes="90vw">
    </picture>
    <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Volgende">›</button>
    <div class="lightbox__counter" id="lbCounter"></div>
  </div>

  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__left">© 2025 JPJ Fotografie</span>
      <span class="footer__center">jpjfotografie.nl</span>
      <span class="footer__right">
        <a href="privacy.html">Privacy</a>
        <a id="footerMail" href="#">info@jpjfotografie.nl</a>
      </span>
      <p class="footer__credit">Gemaakt door <a href="https://portfolio-maartendeklerk.netlify.app/" target="_blank" rel="noopener noreferrer">Maarten de Klerk</a></p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sanity.js"></script>
  <script src="js/portfolio.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>

</html>
