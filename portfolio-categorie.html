<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <title>Categorie — JPJ Fotografie</title>
  <meta name="description" content="Portfolio van JPJ Fotografie. Portret, bruiloften, familie, newborn, dieren en bedrijfsfotografie in Limburg.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "JPJ Fotografie",
    "description": "Professionele fotograaf in Zuid-Limburg",
    "areaServed": [
      { "@type": "City", "name": "Maastricht" },
      { "@type": "City", "name": "Heerlen" },
      { "@type": "AdministrativeArea", "name": "Zuid-Limburg" },
      { "@type": "AdministrativeArea", "name": "Limburg" }
    ],
    "url": "https://www.jpjfotografie.nl",
    "image": "https://www.jpjfotografie.nl/og-image.jpg",
    "priceRange": "$$",
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]
    }
  }
  </script>
  <script>document.documentElement.className += ' js-anim';</script>
</head>
<body>
  <div id="cursor"><span class="cursor__label">Bekijk</span></div>
  <div class="page-transition" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a href="index.html" class="nav__logo">JPJ Fotografie</a>
    <nav class="nav__links" aria-label="Hoofdmenu">
      <a href="portfolio.html" class="nav__link is-active">Portfolio</a>
      <a href="over-mij.html" class="nav__link">Over mij</a>
      <a href="contact.html" class="nav__link">Contact</a>
    </nav>
    <button class="nav__toggle" id="navToggle" aria-label="Menu openen">Menu</button>
  </header>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <button class="mobile-menu__close" id="menuClose" aria-label="Menu sluiten">×</button>
    <a href="portfolio.html" class="mobile-menu__link is-active">Portfolio</a>
    <a href="over-mij.html" class="mobile-menu__link">Over mij</a>
    <a href="contact.html" class="mobile-menu__link">Contact</a>
  </div>

  <main>
    <section class="page-head container">
      <h1 class="page-head__title" id="catTitle">&nbsp;</h1>
      <div class="page-head__rule"></div>
      <p class="page-head__sub" id="catSub">Werk van JPJ Fotografie.</p>
    </section>

    <div class="subnav" id="subnav">
      <div class="subnav__scroll" id="subnavScroll"></div>
    </div>

    <section class="section container">
      <div class="gallery" id="gallery"></div>
    </section>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" id="lbClose" aria-label="Sluiten">×</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Vorige">‹</button>
    <img class="lightbox__img" id="lbImg" src="" alt="">
    <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Volgende">›</button>
    <div class="lightbox__counter" id="lbCounter"></div>
  </div>

  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__left">© 2025 JPJ Fotografie</span>
      <span class="footer__center">jpjfotografie.nl</span>
      <span class="footer__right">
        <a id="footerInsta" href="#" aria-label="Instagram" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <a id="footerMail" href="#">info@jpjfotografie.nl</a>
      </span>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sanity.js"></script>
  <script src="js/portfolio.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
