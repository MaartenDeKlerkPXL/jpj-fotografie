<head>

  <meta property="og:title" content="Contact — JPJ Fotografie">
  <meta property="og:description" content="Neem contact op met JPJ Fotografie voor een vrijblijvend gesprek. Fotoshoot aanvragen in Zuid-Limburg en omgeving.">

  <meta property="og:image:alt" content="JPJ Fotografie — Vakfotograaf in Zuid-Limburg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact — JPJ Fotografie">
  <meta name="twitter:description" content="Neem contact op met JPJ Fotografie voor een vrijblijvend gesprek. Fotoshoot aanvragen in Zuid-Limburg en omgeving.">
  <meta name="twitter:image" content="https://www.jpjfotografie.nl/og-image.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "JPJ Fotografie",
    "description": "Professionele fotograaf in Zuid-Limburg",
    "areaServed": [
      { "@type": "City", "name": "Maastricht" },
      { "@type": "City", "name": "Heerlen" },
      { "@type": "AdministrativeArea", "name": "Zuid-Limburg" },
      { "@type": "AdministrativeArea", "name": "Limburg" }
    ],
    "url": "https://www.jpjfotografie.nl",
    "image": "https://www.jpjfotografie.nl/og-image.jpg",
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]
    }
  }
  </script>
  <script>document.documentElement.className += ' js-anim';</script>
</head>
<body class="page-contact">
  <div id="cursor"><span class="cursor__label">Bekijk</span></div>
  <div class="page-transition" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a href="index.html" class="nav__logo">JPJ Fotografie</a>
    <nav class="nav__links" aria-label="Hoofdmenu">
      <a href="portfolio.html" class="nav__link">Portfolio</a>
      <a href="over-mij.html" class="nav__link">Over mij</a>
      <a href="contact.html" class="nav__link is-active">Contact</a>
    </nav>
    <button class="nav__toggle" id="navToggle" aria-label="Menu openen">Menu</button>
  </header>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <button class="mobile-menu__close" id="menuClose" aria-label="Menu sluiten">×</button>
    <a href="portfolio.html" class="mobile-menu__link">Portfolio</a>
    <a href="over-mij.html" class="mobile-menu__link">Over mij</a>
    <a href="contact.html" class="mobile-menu__link is-active">Contact</a>
  </div>

  <main>
    <section class="contact">
      <div class="contact__photo" id="contactPhoto"></div>
      <div class="contact__form-panel">
        <a href="index.html" class="contact__logo">JPJ Fotografie</a>
        <h1 class="contact__title" id="contactTitel">Laten we kennismaken</h1>
        <p class="contact__sub" id="contactSub">Vertel me over uw fotowensen.</p>

        <form id="contactForm" novalidate>
          <div class="field-wrapper">
            <label for="naam">Naam</label>
            <input type="text" id="naam" name="naam" autocomplete="name" required>
            <span class="field-error" data-error-for="naam"></span>
          </div>

          <div class="field-wrapper">
            <label for="email">E-mailadres</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            <span class="field-error" data-error-for="email"></span>
          </div>

          <div class="field-wrapper">
            <label for="type_shoot">Type fotoshoot (optioneel)</label>
            <select id="type_shoot" name="type_shoot">
              <option value="Ik heb gewoon een vraag" selected>Ik heb gewoon een vraag</option>
              <option>Portret</option>
              <option>Familie &amp; Gezin</option>
              <option>Bruiloft</option>
              <option>Newborn / Baby / Cake Smash</option>
              <option>Bedrijfsfotografie</option>
              <option>Architectuur</option>
              <option>Dieren</option>
              <option>Sport &amp; Evenement</option>
              <option>Anders</option>
            </select>
            <span class="field-error" data-error-for="type_shoot"></span>
          </div>

          <div class="field-wrapper">
            <label for="locatie">Locatie / Omgeving (optioneel)</label>
            <input type="text" id="locatie" name="locatie" placeholder="Bijv. Maastricht, thuis, studio">
          </div>

          <div class="field-wrapper">
            <label for="datum">Gewenste datum (optioneel)</label>
            <input type="date" id="datum" name="datum">
          </div>

          <div class="field-wrapper">
            <label for="bericht">Uw bericht</label>
            <textarea id="bericht" name="bericht" rows="4" required></textarea>
            <span class="field-error" data-error-for="bericht"></span>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">Verzenden <span class="arrow">→</span></button>
        </form>
      </div>
    </section>

    <!-- FAQ -->
    <section class="section container faq">
      <div class="faq__head">
        <h2 class="faq__title">Veelgestelde vragen</h2>
        <div class="faq__rule"></div>
      </div>
      <div class="faq__list" id="faqList"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__left">© 2025 JPJ Fotografie</span>
      <span class="footer__center">jpjfotografie.nl</span>
      <span class="footer__right">
        <a id="footerMail" href="#">info@jpjfotografie.nl</a>
      </span>
      <p class="footer__credit">Gemaakt door <a href="https://portfolio-maartendeklerk.netlify.app/" target="_blank" rel="noopener noreferrer">Maarten de Klerk</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sanity.js"></script>
  <script src="js/contact.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
