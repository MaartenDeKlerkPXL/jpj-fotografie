<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <title>Over mij — JPJ Fotografie</title>
  <meta name="description" content="Jacques van JPJ Fotografie – vakfotograaf geboren in Zuid-Limburg. Persoonlijk, gepassioneerd en altijd op zoek naar het echte moment.">

  <link rel="canonical" href="https://www.jpjfotografie.nl/over-mij.html">

  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="images/favicon/favicon.svg">
  <link rel="apple-touch-icon" href="images/favicon/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JPJ Fotografie">
  <meta property="og:locale" content="nl_NL">
  <meta property="og:url" content="https://www.jpjfotografie.nl/over-mij.html">
  <meta property="og:title" content="Over mij — JPJ Fotografie">
  <meta property="og:description" content="Jacques van JPJ Fotografie – vakfotograaf geboren in Zuid-Limburg. Persoonlijk, gepassioneerd en altijd op zoek naar het echte moment.">
  <meta property="og:image" content="https://www.jpjfotografie.nl/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="JPJ Fotografie — Vakfotograaf in Zuid-Limburg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Over mij — JPJ Fotografie">
  <meta name="twitter:description" content="Jacques van JPJ Fotografie – vakfotograaf geboren in Zuid-Limburg. Persoonlijk, gepassioneerd en altijd op zoek naar het echte moment.">
  <meta name="twitter:image" content="https://www.jpjfotografie.nl/og-image.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "JPJ Fotografie",
    "description": "Professionele fotograaf in Zuid-Limburg",
    "areaServed": [
      { "@type": "City", "name": "Maastricht" },
      { "@type": "City", "name": "Heerlen" },
      { "@type": "AdministrativeArea", "name": "Zuid-Limburg" },
      { "@type": "AdministrativeArea", "name": "Limburg" }
    ],
    "url": "https://www.jpjfotografie.nl",
    "image": "https://www.jpjfotografie.nl/og-image.jpg",
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]
    }
  }
  </script>
  <script>document.documentElement.className += ' js-anim';</script>
</head>
<body>
  <div id="cursor"><span class="cursor__label">Bekijk</span></div>
  <div class="page-transition" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a href="index.html" class="nav__logo">JPJ Fotografie</a>
    <nav class="nav__links" aria-label="Hoofdmenu">
      <a href="portfolio.html" class="nav__link">Portfolio</a>
      <a href="over-mij.html" class="nav__link is-active">Over mij</a>
      <a href="contact.html" class="nav__link">Contact</a>
    </nav>
    <button class="nav__toggle" id="navToggle" aria-label="Menu openen">Menu</button>
  </header>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <button class="mobile-menu__close" id="menuClose" aria-label="Menu sluiten">×</button>
    <a href="portfolio.html" class="mobile-menu__link">Portfolio</a>
    <a href="over-mij.html" class="mobile-menu__link is-active">Over mij</a>
    <a href="contact.html" class="mobile-menu__link">Contact</a>
  </div>

  <main>
    <!-- SPLIT: foto links, naam + verhaal rechts -->
    <section class="about-split">
      <div class="about-split__media">
        <picture>
          <source type="image/webp">
          <img class="about-split__photo" id="aboutHeroPhoto" src="" alt="Jacques Janssen, fotograaf bij JPJ Fotografie" sizes="(max-width: 767px) 100vw, 50vw" loading="eager">
        </picture>
      </div>
      <div class="about-split__text">
        <p class="eyebrow">Mijn verhaal</p>
        <h1 class="about-split__name" id="aboutName">Jacques Janssen</h1>
        <div class="about-split__rule"></div>
        <div class="about-bio" id="bioWrap">
          <div class="about-bio__inner" id="bioText"></div>
        </div>

        <!-- Diensten — ondergeschikt aan het verhaal, in dezelfde kolom -->
        <div class="about-split__services">
          <p class="eyebrow">Ik fotografeer</p>
          <ul class="about-services__list" id="servicesList"></ul>
          <div class="about-services__cta">
            <a href="contact.html" class="arrow-link">Wilt u meer weten? Neem contact op <span class="arrow">→</span></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__left">© 2025 JPJ Fotografie</span>
      <span class="footer__center">jpjfotografie.nl</span>
      <span class="footer__right">
        <a href="privacy.html">Privacy</a>
        <a id="footerMail" href="#">info@jpjfotografie.nl</a>
      </span>
      <p class="footer__credit">Gemaakt door <a href="https://portfolio-maartendeklerk.netlify.app/" target="_blank" rel="noopener noreferrer">Maarten de Klerk</a></p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sanity.js"></script>
  <script src="js/over-mij.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
